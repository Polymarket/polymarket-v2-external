name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Build, Format & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # 1.8.0 changes formatter and branch-coverage semantics; keep the
          # deployment artifacts and CI checks reproducible for this release.
          version: v1.7.1

      - name: Cache Forge build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache
            out
          # Only restore artifacts built from this exact source tree so incremental
          # builds never pick up stale creation code.
          key: forge-check-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'lib/**/*.sol') }}

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check
        id: fmt

      - name: Run Forge build
        run: forge build
        id: build

      - name: Check wrap discipline (no unvalidated UDVT.wrap in production)
        run: make wrap-check

      - name: Check contract sizes (Polygon PIP-30, 32KB)
        run: make sizes

      - name: Run Forge tests
        run: forge test -vvv
        id: test

      - name: Check gas snapshots
        run: forge snapshot --diff --tolerance 1 | grep -v 'setUp()' | (! grep -q '^Diff')
        id: snapshot

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: Cache Forge build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache
            out
          key: forge-build-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'lib/**/*.sol') }}
          restore-keys: forge-build-

      - name: Check coverage threshold
        run: make coverage

  storage:
    name: Storage Layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: Cache Forge build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache
            out
          key: forge-build-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'lib/**/*.sol') }}
          restore-keys: forge-build-

      - name: Run Forge build
        run: forge build --force

      - name: Check storage layouts
        run: make storage-check

  invariant:
    name: Invariant Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: Cache Forge build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache
            out
          key: forge-invariant-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'lib/**/*.sol') }}
          restore-keys: forge-invariant-

      - name: Run Forge invariant tests
        run: forge test -vvv --match-test 'invariant_.*' --no-match-test '^$'

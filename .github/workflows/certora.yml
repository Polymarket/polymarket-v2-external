name: Certora

on:
  pull_request: # runs on PR open + every commit pushed to a PR branch
  workflow_dispatch: # manual trigger

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.conf }}
    runs-on: ubuntu-latest
    # Verification runs on the Certora cloud and requires a prover key. Skip on forks
    # (which cannot access secrets) so external PRs don't fail spuriously.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        conf:
          - Binary-Solvency02
          - Binary-Solvency03
          - Binary-Merge01
          - Binary-Split01
          - Binary-ResultNorm01
          - Binary-ModuleEscrow01
          - Binary-Redeem01
          - Binary-Bridge02
          - NegRisk-Solvency02
          - NegRisk-Merge01
          - NegRisk-ResultNorm01
          - NegRisk-ModuleEscrow01
          - NegRisk-Split01
          - NegRisk-Partition01
          - NegRisk-Partition02
          - NegRisk-ModuInt01
          - NegRisk-Convert01
          - NegRisk-Horizontal01
          - NegRisk-Redeem01
          - NegRisk-Bridge02
          - Combinatorial-ComboSplitMerge01
          - Combinatorial-ModuleEscrow01
          - Combinatorial-ModuleEscrow01-mergeOnEvent
          - Combinatorial-PrepareCombo01
          - Collateral-WrapUnwrap01
          - Collateral-AccessCollateralMint01
          - Exchange-Solvency01
          - Exchange-TakerCredit01
          - Exchange-OrderFillMonotone01
          - Exchange-FeeCap01b
          - Exchange-PrepareCombo01
          - Exchange-TakerAmount01
          - Exchange-UserPause01
          - Exchange-Sig01a
          - Exchange-Sig01b
          - PositionManager-AccessInv01
          - PositionManager-Integrity01
          - PositionManager-AccessUriPayout01
          - eq/BinaryMigrationResolutionEquivalence
          - eq/NegRiskMigrationEquivalence

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Certora CLI
        run: pip install certora-cli==8.19.0

      - name: Install solc 0.8.34 as solc8.34
        run: |
          pip install solc-select
          solc-select install 0.8.34
          solc-select use 0.8.34
          # Confs reference the binary name `solc8.34`; expose it on PATH.
          ln -sf "$(solc-select versions --artifacts 2>/dev/null | true; echo "$HOME/.solc-select/artifacts/solc-0.8.34/solc-0.8.34")" /usr/local/bin/solc8.34 || \
            ln -sf "$HOME/.solc-select/artifacts/solc-0.8.34/solc-0.8.34" /usr/local/bin/solc8.34
          solc8.34 --version

      - name: Apply CombinatorialModule event-memory-reset munge
        if: contains(matrix.conf, 'Combinatorial')
        run: git apply certora/patches/CombinatorialModule_eventMemoryReset.patch

      - name: Apply BaseMigrationMixin migrate-redeem seam munge
        if: contains(matrix.conf, 'Binary') || contains(matrix.conf, 'NegRisk')
        run: git apply certora/patches/BaseMigrationMixin_migrateRedeemSeam.patch

      - name: Apply NegRiskModule _storeResult virtual seam munge
        if: contains(matrix.conf, 'NegRisk')
        run: git apply certora/patches/NegRiskModule_storeResultVirtual.patch

      - name: Apply PositionManager approval-slot munge
        if: contains(matrix.conf, 'PositionManager') || contains(matrix.conf, 'Binary') || contains(matrix.conf,
          'NegRisk') || contains(matrix.conf, 'Combinatorial')
        run: git apply certora/patches/PositionManager_approval.patch

      - name: Run Certora Prover — ${{ matrix.conf }}
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
        run: certoraRun "certora/confs/${{ matrix.conf }}.conf" --server production --wait_for_results all

      # Revert the patches after the run.
      - name: Revert PositionManager approval-slot munge
        if: always() && (contains(matrix.conf, 'PositionManager') || contains(matrix.conf, 'Binary') ||
          contains(matrix.conf, 'NegRisk') || contains(matrix.conf, 'Combinatorial'))
        run: git apply -R certora/patches/PositionManager_approval.patch

      - name: Revert NegRiskModule _storeResult virtual seam munge
        if: always() && contains(matrix.conf, 'NegRisk')
        run: git apply -R certora/patches/NegRiskModule_storeResultVirtual.patch

      - name: Revert BaseMigrationMixin migrate-redeem seam munge
        if: always() && (contains(matrix.conf, 'Binary') || contains(matrix.conf, 'NegRisk'))
        run: git apply -R certora/patches/BaseMigrationMixin_migrateRedeemSeam.patch

  # --------------------------------------------------------------------------
  # Applies the full patch set globally via patch.sh and verifies against production.
  # --------------------------------------------------------------------------
  verify_pristine_munges:
    name: ${{ matrix.conf }}
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        conf:
          - accesscontrol/Initializable_BinaryModule
          - accesscontrol/Initializable_CcipBridge
          - accesscontrol/Initializable_CollateralToken
          - accesscontrol/Initializable_CombinatorialModule
          - accesscontrol/Initializable_Exchange
          - accesscontrol/Initializable_NegRiskModule
          - accesscontrol/Initializable_OOReporterModule
          - accesscontrol/Initializable_OracleAggregator
          - accesscontrol/Initializable_PositionManager
          - accesscontrol/PositionManager
          - bridge/CcipBridge
          - eq/CombinatorialHelperEquivalence
          - eq/CombinatorialHelperEquivalence_flip
          - eq/CombinatorialPayoutEquivalence
          - eq/PositionManagerSummaryEquivalence
          - oracle/AggregatorAccess
          - oracle/AggregatorConfig
          - oracle/AggregatorConfig-ResultLength
          - oracle/AggregatorLifecycle
          - oracle/AggregatorResolution
          - oracle/AggregatorVotes
          - oracle/AggregatorWindows
          - oracle/EnumerableSetShim
          - oracle/OOReporterAccess
          - oracle/OOReporterPure
          - oracle/OOReporterRegistration
          - oracle/OOReporterRelay
          - solvency/BinaryModule
          - solvency/BinaryModuleMigrate
          - solvency/BinaryModuleMigrateFrom
          - solvency/CombinatorialCanonical
          - solvency/CombinatorialLegStore
          - solvency/CombinatorialModule
          - solvency/CombinatorialModuleRedeem
          - solvency/CombinatorialRefineCompress
          - solvency/CombinatorialRefineForward
          - solvency/CombinatorialRefineInverse
          - solvency/CombinatorialRefineWrap
          - solvency/CombinatorialRoundTrip
          - solvency/CombinatorialWellFormed
          - solvency/NegRiskModule
          - solvency/NegRiskModuleConvert
          - solvency/NegRiskModuleMigrate
          - solvency/NegRiskModuleMigrateFrom
          - solvency/PositionManager

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Certora CLI
        run: pip install certora-cli==8.19.0

      - name: Install solc 0.8.34 as solc8.34
        run: |
          pip install solc-select
          solc-select install 0.8.34
          solc-select use 0.8.34
          # Confs reference the binary name `solc8.34`; expose it on PATH.
          ln -sf "$(solc-select versions --artifacts 2>/dev/null | true; echo "$HOME/.solc-select/artifacts/solc-0.8.34/solc-0.8.34")" /usr/local/bin/solc8.34 || \
            ln -sf "$HOME/.solc-select/artifacts/solc-0.8.34/solc-0.8.34" /usr/local/bin/solc8.34
          solc8.34 --version

      - name: Apply verification munges
        run: bash certora/scripts/patch.sh

      - name: Run Certora Prover — ${{ matrix.conf }}
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
        run: certoraRun "certora/confs/${{ matrix.conf }}.conf" --server production --wait_for_results all

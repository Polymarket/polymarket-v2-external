{
    "assert_autofinder_success": true,
    "files": [
        "certora/helpers/CombinatorialModuleHarness.sol:CombinatorialModuleHarness"
    ],
    "global_timeout": "7200",
    "hashing_length_bound": 512,
    "loop_iter": 3,
    "msg": "EQ CombinatorialModule helper summaries flipLegCVL trimArrayCVL yesBasketCVL vs real code (value and revert)",
    "optimistic_hashing": true,
    "optimistic_loop": true,
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/=lib/solady",
        "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
        "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
        "@forge-std/=lib/forge-std"
    ],
    "prover_args": [
        " -destructiveOptimizations twostage"
    ],
    "exclude_rule": [
        "flipLegEquivalence"
    ],
    "rule_sanity": "basic",
    "smt_timeout": 1800,
    "solc": "solc8.34",
    "solc_optimize": 1,
    "use_relpaths_for_solc_json": true,
    "verify": "CombinatorialModuleHarness:certora/specs/eq/CombinatorialHelperEquivalence.spec",
    "wait_for_results": "none"
}

{
  "assert_autofinder_success": true,
  "files": [
    "src/positionManager/PositionManager.sol",
    "src/collateral/CollateralToken.sol",
    "certora/harnesses/CombinatorialModule.sol:CombinatorialModule",
    "certora/harnesses/ConditionalTokens.sol:ConditionalTokens"
  ],
  "global_timeout": "7200",
  "packages": [
    "@polymarket-v2/src/=src",
    "@solady/=lib/solady",
    "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
    "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
    "@forge-std/=lib/forge-std"
  ],
  "prover_args": [
    " -destructiveOptimizations twostage -mediumTimeout 20 -lowTimeout 20 -tinyTimeout 20 -depth 20 -assumeFPStrictlyMonotonic false"
  ],
  "smt_timeout": 1800,
  "solc": "solc8.34",
  "solc_optimize": 200,
  "use_relpaths_for_solc_json": true,
  "optimistic_loop": true,
  "optimistic_hashing": true,
  "loop_iter": 2,
  "multi_assert_check": true,
  "rule_sanity": "basic",
  "msg": "EQ stepping stones: CombinatorialModule positionPayoutCVL vs real _getPositionPayout (revert and value)",
  "verify": "PositionManager:certora/specs/eq/CombinatorialPayoutEquivalence.spec",
  "wait_for_results": "none",
  "disable_solc_optimizers": [
    "cse",
    "peephole",
    "inliner",
    "deduplicate"
  ]
}

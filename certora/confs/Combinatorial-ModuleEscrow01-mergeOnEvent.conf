{
    // MODULE-ESCROW-01 for the ONE heavy instance of the parametric escrow rule.
    //
    // `moduleNeverAccumulatesPositions` sweeps every non-view CombinatorialModuleHarness method;
    // `mergeOnEvent` is the outlier — it walks the event's leg grid with the assembly-bearing
    // position-id builder, so it is the instance that starves the shared budget while all the others
    // verify. The `rule`/`method` pair here gives that single instance the whole
    // global_timeout/smt_timeout; nothing about the rule changes. Scene, munges and bounds are
    // otherwise identical to certora/confs/Combinatorial-ModuleEscrow01.conf.
    //
    // Munge regime: same as every Combinatorial-* conf in the `verify` CI job —
    // CombinatorialModule_eventMemoryReset plus PositionManager_approval.
    "assert_autofinder_success": true,
    "build_cache": true,
    "files": [
        "certora/helpers/CombinatorialModuleHarness.sol:CombinatorialModuleHarness",
        "src/positionManager/PositionManager.sol",
        "src/collateral/CollateralToken.sol",
        "certora/mocks/USDCe.sol"
    ],
    "global_timeout": 7200,
    "hashing_length_bound": 1024,
    "loop_iter": 3,
    "msg": "CombinatorialModule MODULE-ESCROW-01 mergeOnEvent instance only",
    "optimistic_hashing": true,
    "optimistic_loop": true,
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/=lib/solady",
        "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
        "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
        "@forge-std/=lib/forge-std"
    ],
    "parametric_contracts": [
        "CombinatorialModuleHarness"
    ],
    "rule": [
        "moduleNeverAccumulatesPositions"
    ],
    "method": "mergeOnEvent(address,uint256,bytes29,uint256)",
    "smt_timeout": "7200",
    "rule_sanity": "basic",
    "solc": "solc8.34",
    "solc_optimize": 1,
    "use_relpaths_for_solc_json": true,
    "verify": "CombinatorialModuleHarness:certora/specs/Combinatorial-ModuleEscrow01.spec"
}
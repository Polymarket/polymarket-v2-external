{
    "assert_autofinder_success": true,
    "build_cache": true,
    "files": [
        "certora/helpers/ExchangeHarness.sol:ExchangeHarness",
        "certora/helpers/CombinatorialModuleHarness.sol:CombinatorialModuleHarness"
    ],
    "link": [
        "ExchangeHarness:COMBINATORIAL_MODULE=CombinatorialModuleHarness"
    ],
    "verify": "ExchangeHarness:certora/specs/Exchange-PrepareCombo01.spec",
    "loop_iter": "3",
    "optimistic_loop": true,
    "optimistic_hashing": true,
    "hashing_length_bound": "1024",
    "rule_sanity": "basic",
    "global_timeout": "7200",
    "smt_timeout": 7200,
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/=lib/solady",
        "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
        "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
        "@forge-std/=lib/forge-std"
    ],
    "prover_args": [
        " -destructiveOptimizations twostage -smt_initialSplitDepth 4 -depth 10 -mediumTimeout 2"
    ],
    "split_rules": [
        "entryTakerOutcomeIsYesOrNo"
    ],
    "server": "production",
    "solc": "solc8.34",
    "solc_optimize": 200,
    "use_relpaths_for_solc_json": true,
    "msg": "EXCHANGE-PREPARE-COMBO-01 entry binds prepared condition to taker tokenId"
}

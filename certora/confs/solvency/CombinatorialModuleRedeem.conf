{
    "assert_autofinder_success": true,
    "files": [
        "src/positionManager/PositionManager.sol",
        "src/collateral/CollateralToken.sol",
        "certora/harnesses/CombinatorialModule.sol",
        //"src/modules/BinaryModule.sol",
        //"src/modules/NegRiskModule.sol",
        "certora/harnesses/ConditionalTokens.sol:ConditionalTokens",
        //"certora/mocks/USDCe.sol",
        //"certora/mocks/DummyERC20Impl.sol"
    ],
    "global_timeout": "7200",
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/=lib/solady",
        "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
        "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
        "@forge-std/=lib/forge-std"
    ],
    "parametric_contracts": [
        // "PositionManager",
        "CombinatorialModule"
    ],
    "prover_args": [
        " -assumeFPStrictlyMonotonic false -destructiveOptimizations twostage -mediumTimeout 20 -lowTimeout 20 -tinyTimeout 20 -depth 20"
    ],
    "smt_timeout": "7200",
    "solc": "solc8.34",
    "solc_optimize": 200, // 1000000,
    "use_relpaths_for_solc_json": true,
    "optimistic_loop": true,
    "optimistic_hashing": true,
    "loop_iter": 2,
    "rule_sanity": "basic",
    "msg": "GLOB-SOLVENCY: PositionManager-parametric CombinatorialModule",
    "verify": "PositionManager:certora/specs/solvency/CombinatorialModuleRedeem.spec",
    "wait_for_results": "none",
    "disable_solc_optimizers": ["cse", "peephole", "inliner", "deduplicate"],
    //"build_cache": true
}

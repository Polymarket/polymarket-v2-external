{
    "assert_autofinder_success": true,
    "files": [
        "src/positionManager/PositionManager.sol",
        "src/collateral/CollateralToken.sol",
        "certora/harnesses/CombinatorialModule.sol",
        "certora/harnesses/ConditionalTokens.sol:ConditionalTokens",
    ],
    "global_timeout": "7200",
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/=lib/solady",
        "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
        "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
        "@forge-std/=lib/forge-std"
    ],
    "parametric_contracts": [
        "CombinatorialModule"
    ],
    "prover_args": [
		"-assumeFPStrictlyMonotonic false -destructiveOptimizations twostage -mediumTimeout 20 -lowTimeout 20 -tinyTimeout 20 -depth 20 -s [z3:def{randomSeed=1},z3:def{randomSeed=2},z3:def{randomSeed=3},z3:def{randomSeed=4},z3:def{randomSeed=5},z3:def{randomSeed=6},z3:def{randomSeed=7},z3:def{randomSeed=8},z3:def{randomSeed=9},z3:def{randomSeed=10}]",
	],
    "multi_assert_check": true,
    "split_rules": [
        "compressResidualValueConserving",
        "compressTerminalZeroValueConserving",
        "compressAllResolvedValueConserving"
    ],
    // Checked in their own confs
    "exclude_rule": [
        "storedConjunctionsCanonical",
        "storedConjunctionsWellFormed"
    ],
    "smt_timeout": "7200",
    "solc": "solc8.34",
    "solc_optimize": 200,
    "use_relpaths_for_solc_json": true,
    "optimistic_loop": true,
    "optimistic_hashing": true,
    "loop_iter": 2,
    "rule_sanity": "basic",
    "msg": "CombinatorialModule compress value conservation",
    "verify": "CombinatorialModule:certora/specs/solvency/CombinatorialRefineCompress.spec",
    "wait_for_results": "none",
    "disable_solc_optimizers": ["cse", "peephole", "inliner", "deduplicate"],
}
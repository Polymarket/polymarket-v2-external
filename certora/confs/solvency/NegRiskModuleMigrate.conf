{
    "assert_autofinder_success": true,
    "files": [
        "src/positionManager/PositionManager.sol",
        "src/collateral/CollateralToken.sol",
        "certora/harnesses/NegRiskModule.sol",
        "src/modules/BinaryModule.sol",
        "src/modules/CombinatorialModule.sol",
        "certora/harnesses/ConditionalTokens.sol:ConditionalTokens",
        "certora/mocks/USDCe.sol",
        "certora/mocks/DummyERC20Impl.sol"
    ],
    "global_timeout": "7200",
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/=lib/solady",
        "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
        "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
        "@forge-std/=lib/forge-std"
    ],
    "prover_args": [
        "  -destructiveOptimizations twostage -backendStrategy singleRace -smt_useLIA false -smt_useNIA true -depth 0  -s [z3:def{randomSeed=1},z3:def{randomSeed=2},z3:def{randomSeed=3},z3:def{randomSeed=4},z3:def{randomSeed=5},z3:def{randomSeed=6},z3:def{randomSeed=7},z3:def{randomSeed=8},z3:def{randomSeed=9},z3:def{randomSeed=10}]"
    ],
    "smt_timeout": "7200",
    "solc": "solc8.34",
    "solc_optimize": 1000000,
    "use_relpaths_for_solc_json": true,
    "optimistic_loop": true,
    "loop_iter": 3,
    "multi_assert_check": true,
    "split_rules": [
        "solvencyPreservedMigrateLengthSmallerOrEqualThan1",
        "solvencyPreservedMigrateSameCondition",
        "solvencyPreservedMigrateSameEvent",
        "solvencyPreservedMigrateDistinctEvents"
    ],
    "rule_sanity": "basic",
    "msg": "GLOB-SOLVENCY: NegRiskModule migratePositions stones",
    "verify": "PositionManager:certora/specs/solvency/NegRiskModuleMigrate.spec",
    "wait_for_results": "none",
    "disable_solc_optimizers": ["cse", "peephole", "inliner", "deduplicate"],
    "build_cache": true
}
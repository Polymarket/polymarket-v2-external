{
    "assert_autofinder_success": true,
    "files": [
        "certora/harnesses/EnumerableSetShimHarness.sol"
    ],
    "global_timeout": "1800",
    // The whole point of this conf: a FILE-GRANULAR remapping substitutes the assembly-free shim for
    // Solady's EnumerableSetLib, for this build only. `src/` is untouched, and every other conf in the
    // repo keeps the real library. The remapping must precede the general "@solady/" prefix.
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/src/utils/EnumerableSetLib.sol=certora/shims/EnumerableSetLib.sol",
        "@solady/=lib/solady"
    ],
    "parametric_contracts": "EnumerableSetShimHarness",
    "prover_args": [
        "-quiet",
    ],
    "solc": "solc8.34",
    "solc_optimize": 1000000,
    "use_relpaths_for_solc_json": true,
    "optimistic_loop": true,
    "loop_iter": 3,
    "rule_sanity": "basic",
    "msg": "SET-ADT: enumerable set laws over the assembly-free shim",
    "verify": "EnumerableSetShimHarness:certora/specs/oracle/EnumerableSetShim.spec",
    "wait_for_results": "none",
    "disable_solc_optimizers": ["cse", "peephole", "inliner", "deduplicate"],
    "build_cache": true,
}

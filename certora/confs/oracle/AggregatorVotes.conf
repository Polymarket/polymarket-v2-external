{
    "assert_autofinder_success": true,
    "files": [
        "certora/harnesses/OracleAggregator.sol",
        "src/oracle/modules/reporters/EOAReporterModule.sol",
        "src/oracle/test/mocks/MockDisputerModule.sol",
        "src/oracle/test/mocks/MockArbitratorModule.sol",
        "certora/mocks/RevertingArbitratorMock.sol",
        "certora/mocks/BinaryReporterTargetMock.sol",
        "src/positionManager/PositionManager.sol"
    ],

    "global_timeout": "7200",
    "smt_timeout": "7200",
    // The set shim: a FILE-GRANULAR remapping substitutes an assembly-free EnumerableSetLib for
    // Solady's, for this build only — `src/` is untouched and every other conf keeps the real library.
    // Must precede the general "@solady/" prefix. Rationale and evidence: the shim's header, the ADT
    // laws in certora/specs/oracle/EnumerableSetShim.spec, and the README refinement log. Without it
    // the Prover cannot link Solady's assembly-derived slot writes to its slot reads, which makes
    // ORACLE-CONF-01 unprovable and leaves every `initializeRequest` instance UNKNOWN.
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/src/utils/EnumerableSetLib.sol=certora/shims/EnumerableSetLib.sol",
        "@solady/=lib/solady",
        "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
        "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
        "@forge-std/=lib/forge-std"
    ],
    "parametric_contracts": "OracleAggregator",
    "prover_args": [
        "-quiet",
        "-destructiveOptimizations twostage",
    ],
    "solc": "solc8.34",
    "solc_optimize": 1000000,
    "use_relpaths_for_solc_json": true,
    "optimistic_loop": true,
    // loop_iter 3: the module-registration, market-pause and rule-broadcast loops must reach a
    // SECOND element for the skip-if-already-registered branch to be exercised.
    "loop_iter": 3,
    "optimistic_hashing": true,
    "hashing_length_bound": "384",
    "split_rules": [
        "thresholdBacksLiveProposal",
        "proposalImpliesRegisteredRequest",
        "voteCountersAdvanceOnlyThroughReportOrDispute",
        "unregisteredRequestHasCleanDisputeState",
        "disputeQuorumImpliesEscalation",
    ],
    "rule_sanity": "basic",
    "msg": "ORACLE-THRESH-01 ORACLE-VOTE-01 ORACLE-VOTE-02 ORACLE-PROP-01 ORACLE-DISP-01: OracleAggregator quorum and vote accounting",
    "verify": "OracleAggregator:certora/specs/oracle/AggregatorVotes.spec",
    "wait_for_results": "none",
    "disable_solc_optimizers": ["cse", "peephole", "inliner", "deduplicate"],
    "build_cache": true,
}

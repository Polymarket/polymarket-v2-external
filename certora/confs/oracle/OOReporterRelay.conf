{
    "assert_autofinder_success": true,
    "files": [
        "certora/harnesses/OOReporterModule.sol",
        "src/oracle/OracleAggregator.sol",
        "lib/managed-oracle/pm-v2-oo-reporter/src/OOReporter.sol",
        "certora/mocks/BinaryReporterTargetMock.sol"
    ],
    "global_timeout": "3600",
    "smt_timeout": "3600",
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/=lib/solady",
        "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
        "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
        "managed-oracle/pm-v2-oo-reporter/=lib/managed-oracle/pm-v2-oo-reporter/src",
        "@openzeppelin/contracts-upgradeable/=lib/managed-oracle/pm-v2-oo-reporter/lib/openzeppelin-contracts-upgradeable/contracts",
        "@openzeppelin/contracts/=lib/managed-oracle/pm-v2-oo-reporter/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts",
        "@forge-std/=lib/forge-std"
    ],
    "parametric_contracts": "OOReporterModule",
    "prover_args": [
        "-quiet",
    ],
    "solc": "solc8.34",
    "solc_optimize": 1000000,
    "use_relpaths_for_solc_json": true,
    "optimistic_loop": true,
    "loop_iter": 3,
    // keccak256(abi.encode(uint256[1])) is a fixed 96-byte pre-image; the aggregator also
    // hashes (requestId, resultHash) for the vote key. 384 leaves headroom.
    "optimistic_hashing": true,
    "hashing_length_bound": "384",
    "rule_sanity": "basic",
    "msg": "OO-RELAY-01 OO-ATOMIC-01: OOReporterModule relay integrity against the real aggregator",
    "verify": "OOReporterModule:certora/specs/oracle/OOReporterRelay.spec",
    "wait_for_results": "none",
    "disable_solc_optimizers": ["cse", "peephole", "inliner", "deduplicate"],
    "build_cache": true,
}

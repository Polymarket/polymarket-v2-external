{
	"assert_autofinder_success": true,
	"build_cache": true,
	"disable_solc_optimizers": [
		"cse",
		"peephole",
		"inliner",
		"deduplicate"
	],
	"files": [
		"certora/helpers/NegRiskModuleHarness.sol:NegRiskModuleHarness",
		"src/positionManager/PositionManager.sol",
		"src/collateral/CollateralToken.sol",
		"certora/harnesses/ConditionalTokens.sol:ConditionalTokens",
		"certora/mocks/USDCe.sol",
		"certora/mocks/DummyERC20Impl.sol"
	],
	"global_timeout": 7200,
	"hashing_length_bound": 512,
	"loop_iter": 3,
	"msg": "NegRisk Module Solvency",
	"optimistic_hashing": true,
	"optimistic_loop": true,
	"packages": [
		"@polymarket-v2/src/=src",
		"@solady/=lib/solady",
		"@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
		"@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
		"@forge-std/=lib/forge-std"
	],
	"parametric_contracts": [
		"NegRiskModuleHarness"
	],
	"prover_args": [
		"  -destructiveOptimizations twostage -s [z3:def{randomSeed=1},z3:def{randomSeed=2},z3:def{randomSeed=3},z3:def{randomSeed=4},z3:def{randomSeed=5},z3:def{randomSeed=6},z3:def{randomSeed=7},z3:def{randomSeed=8},z3:def{randomSeed=9},z3:def{randomSeed=10}]"
	],
	"rule_sanity": "basic",
	"server": "production",
	"smt_timeout": 7200,
	"solc": "solc8.34",
	"solc_optimize": 1,
	"use_relpaths_for_solc_json": true,
	"verify": "NegRiskModuleHarness:certora/specs/NegRisk-Solvency02.spec",
	"exclude_method": [
		"NegRiskModuleHarness.redeemIfResolvedDuringMigrateReal(bytes31,bytes32)",
		"NegRiskModuleHarness.legacyMintedKey(bytes32,uint256)"
	]
}

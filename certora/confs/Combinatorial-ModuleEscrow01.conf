{
    "assert_autofinder_success": true,
    "build_cache": true,
    "files": [
        "certora/helpers/CombinatorialModuleHarness.sol:CombinatorialModuleHarness",
        "src/positionManager/PositionManager.sol",
        "src/collateral/CollateralToken.sol",
        "certora/mocks/USDCe.sol"
    ],
    "global_timeout": 7200,
    "hashing_length_bound": 1024,
    "loop_iter": 3,
    "msg": "CombinatorialModule MODULE-ESCROW-01",
    "optimistic_hashing": true,
    "optimistic_loop": true,
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/=lib/solady",
        "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
        "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
        "@forge-std/=lib/forge-std"
    ],
    "parametric_contracts": [
        "CombinatorialModuleHarness"
    ],
    // mergeOnEvent is verified on its own conf
    // in certora/confs/Combinatorial-ModuleEscrow01-mergeOnEvent.conf 
    "exclude_method": [
        "mergeOnEvent(address,uint256,bytes29,uint256)"
    ],
    "rule_sanity": "basic",
    "solc": "solc8.34",
    "solc_optimize": 1,
    "use_relpaths_for_solc_json": true,
    "verify": "CombinatorialModuleHarness:certora/specs/Combinatorial-ModuleEscrow01.spec"
}

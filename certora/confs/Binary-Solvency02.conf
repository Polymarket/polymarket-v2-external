    "loop_iter": 3,
    "optimistic_hashing": true,
    "optimistic_loop": true,
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/=lib/solady",
        "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
        "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
        "@forge-std/=lib/forge-std"
    ],
    "parametric_contracts": "BinaryModuleHarness",
    "prover_args": [
        "-destructiveOptimizations twostage -backendStrategy singleRace -smt_useLIA false -smt_useNIA true -smt_initialSplitDepth 2 -depth 15 -mediumTimeout 10 -dontStopAtFirstSplitTimeout true -s [z3:def{randomSeed=1},z3:def{randomSeed=2},z3:def{randomSeed=3},z3:def{randomSeed=4},z3:def{randomSeed=5},z3:def{randomSeed=6},z3:def{randomSeed=7},z3:def{randomSeed=8},z3:def{randomSeed=9},z3:def{randomSeed=10}]"
    ],
    "rule_sanity": "basic",
    "server": "production",
    "solc": "solc8.34",
    "smt_timeout": 60,
    "solc_optimize": 1000000,
    "use_relpaths_for_solc_json": true,
    "verify": "BinaryModuleHarness:certora/specs/Binary-Solvency02.spec",
    "disable_solc_optimizers": ["cse", "peephole", "inliner", "deduplicate"],

{
    "assert_autofinder_success": true,
    "files": [
        "certora/harnesses/accesscontrol/CollateralToken.sol"
    ],
    "global_timeout": "1200",
    "packages": [
        "@polymarket-v2/src/=src",
        "@solady/=lib/solady",
        "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm",
        "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts",
        "@forge-std/=lib/forge-std"
    ],
    "parametric_contracts": "CollateralToken",
    // permit's EIP-2612 signature check because of ecrecover
    "exclude_method": [
        "CollateralToken.permit(address,address,uint256,uint256,uint8,bytes32,bytes32)"
    ],
    "prover_args": [
        "-quiet",
    ],
    "solc": "solc8.34",
    "solc_optimize": 1000000,
    "use_relpaths_for_solc_json": true,
    "optimistic_loop": true,
    "optimistic_hashing": true,
    "loop_iter": 3,
    "rule_sanity": "basic",
    "msg": "ACCESS-INIT-01: CollateralToken",
    "verify": "CollateralToken:certora/specs/accesscontrol/Initializable.spec",
    "wait_for_results": "none",
    "disable_solc_optimizers": ["cse", "peephole", "inliner", "deduplicate"],
    "build_cache": true,
}
